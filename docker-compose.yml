services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=taskforge;Username=taskforge;Password=taskforge"
      Jwt__Key: "change-this-to-a-long-random-string-in-production"
      Jwt__Issuer: "tasks-api"
      Jwt__Audience: "tasks-api"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
